name: 1. Fetch Light Status & Record Audit

on:
  schedule:
    # --- Morning Shift Window (06:30 AM - 09:30 AM IST) ---
    # 07:30 AM IST (02:00 UTC) - Morning Check 1 (Inside shift)
    - cron: '0 2 * * *'
    # 09:30 AM IST (04:00 UTC) - Morning Check 2 (After shift ends)
    - cron: '0 4 * * *'
    
    # --- Evening Shift Window (05:30 PM - 08:30 PM IST) ---
    # 06:30 PM IST (13:00 UTC) - Evening Check 3 (Inside shift)
    - cron: '0 13 * * *'
    # 08:30 PM IST (15:00 UTC) - Evening Check 4 (After shift ends)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      time_slot:
        description: 'Audit Time Slot (e.g. 07:30, 09:30, 18:30, 20:30)'
        required: false
        default: '07:30'

permissions:
  contents: write

jobs:
  fetch-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Determine Time Slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SLOT=${{ github.event.inputs.time_slot }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge "01" ] && [ "$HOUR" -lt "03" ]; then
              echo "SLOT=07:30" >> $GITHUB_ENV
            elif [ "$HOUR" -ge "03" ] && [ "$HOUR" -lt "08" ]; then
              echo "SLOT=09:30" >> $GITHUB_ENV
            elif [ "$HOUR" -ge "12" ] && [ "$HOUR" -lt "14" ]; then
              echo "SLOT=18:30" >> $GITHUB_ENV
            else
              echo "SLOT=20:30" >> $GITHUB_ENV
            fi
          fi

      - name: Execute ThingsBoard Status Fetch & Save Snapshot
        env:
          THINGSBOARD_HOST: ${{ secrets.THINGSBOARD_HOST }}
          THINGSBOARD_USERNAME: ${{ secrets.THINGSBOARD_USERNAME }}
          THINGSBOARD_PASSWORD: ${{ secrets.THINGSBOARD_PASSWORD }}
          LIGHT_UIDS: ${{ secrets.LIGHT_UIDS }}
          TELEMETRY_RELAY_KEY: ${{ secrets.TELEMETRY_RELAY_KEY }}
          SAVE_LOCAL_HTML: "True"
        run: |
          python test_audit.py $SLOT --no-email

      - name: Commit & Push Updated Audit History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit_history.json logs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Record audit snapshot for $SLOT [skip ci]" && git push)
