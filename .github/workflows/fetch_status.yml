name: 1. Fetch Light Status & Record Audit

on:
  workflow_dispatch:
    inputs:
      time_slot:
        description: 'Audit Time Slot (e.g. 07:30, 09:30, 18:30, 20:30)'
        required: false
        default: ''
  repository_dispatch:
    types: [audit_trigger, fetch_status]

permissions:
  contents: write

jobs:
  fetch-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Determine Time Slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.time_slot }}" ]; then
            echo "SLOT=${{ github.event.inputs.time_slot }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "${{ github.event.client_payload.time_slot }}" ]; then
            echo "SLOT=${{ github.event.client_payload.time_slot }}" >> $GITHUB_ENV
          else
            CURRENT_SLOT=$(TZ="Asia/Kolkata" date +%H:%M)
            echo "SLOT=$CURRENT_SLOT" >> $GITHUB_ENV
          fi

      - name: Execute ThingsBoard Status Fetch & Save Snapshot
        env:
          TZ: "Asia/Kolkata"
          THINGSBOARD_HOST: ${{ secrets.THINGSBOARD_HOST }}
          THINGSBOARD_USERNAME: ${{ secrets.THINGSBOARD_USERNAME }}
          THINGSBOARD_PASSWORD: ${{ secrets.THINGSBOARD_PASSWORD }}
          LIGHT_UIDS: ${{ secrets.LIGHT_UIDS }}
          TELEMETRY_RELAY_KEY: ${{ secrets.TELEMETRY_RELAY_KEY }}
          SAVE_LOCAL_HTML: "False"
        run: |
          python test_audit.py $SLOT --no-email

      - name: Commit & Push Updated Audit History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Record audit snapshot for $SLOT [skip ci]" && git push)
