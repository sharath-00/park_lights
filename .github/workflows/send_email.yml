name: 2. Generate & Send Daily Email Report

on:
  schedule:
    # 08:45 PM IST (15:15 UTC) - End of Day Consolidated Email Dispatch
    - cron: '15 15 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date YYYY-MM-DD (leave empty for today)'
        required: false
        default: ''
  repository_dispatch:
    types: [report_trigger, send_email]

permissions:
  contents: write

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Dispatch Email Audit Report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          SAVE_LOCAL_HTML: "True"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python send_report.py ${{ github.event.inputs.target_date }}
          elif [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "${{ github.event.client_payload.target_date }}" ]; then
            python send_report.py ${{ github.event.client_payload.target_date }}
          else
            python send_report.py today
          fi

      - name: Commit & Push Generated Local Report Preview
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Save generated daily email report preview [skip ci]" && git push)
