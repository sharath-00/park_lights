name: Daily 5B Innovation Park Lights Audit

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date YYYY-MM-DD (leave empty for today)'
        required: false
        default: ''
  repository_dispatch:
    types: [audit_trigger_5b, report_trigger_5b, send_email_5b, send_email_all]
  schedule:
    # 07:15 AM IST (01:45 AM UTC) daily after the 07:00 AM checkpoint
    - cron: '45 1 * * *'

permissions:
  contents: write

jobs:
  send-email-5b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f five_b_innovation/requirements.txt ]; then pip install -r five_b_innovation/requirements.txt; fi

      - name: Setup Service Account (if secret provided)
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_5B || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > five_b_innovation/service.json

      - name: Dispatch 5B Email Audit Report
        env:
          TZ: "Asia/Kolkata"
          THINGSBOARD_HOST: ${{ secrets.THINGSBOARD_HOST || 'https://schnelliot.in' }}
          THINGSBOARD_USERNAME: ${{ secrets.THINGSBOARD_USERNAME }}
          THINGSBOARD_PASSWORD: ${{ secrets.THINGSBOARD_PASSWORD }}
          THINGSBOARD_CUSTOMER_ID: ${{ secrets.THINGSBOARD_CUSTOMER_ID_5B || '3e268290-3989-11f1-9e5f-85a6074555d7' }}
          TELEMETRY_RELAY_KEY: ${{ secrets.TELEMETRY_RELAY_KEY || 'rly' }}
          AUDIT_TIMINGS: ${{ secrets.AUDIT_TIMINGS_5B || '19:00,22:00,05:00,07:00' }}
          EXPECTED_DAILY_RUNS: '4'
          GOOGLE_SHEET_ID_OR_URL: ${{ secrets.FIVE_B_PARK_LIGHTS_SHEET_URL || secrets.GOOGLE_SHEET_ID_OR_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQIS2N_C4VqwLafeJaIvM0JLPv-Ip9XuWTEl0vsliEyF2k9C7E_tI8ypmg-QY5CcKYu8djgOdiDt_-Q/pub?gid=1923123572&single=true&output=csv' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'True' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL || secrets.SMTP_USERNAME }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS_5B || secrets.RECIPIENT_EMAILS || '71762332038@cit.edu.in' }}
          SAVE_LOCAL_HTML: "False"
        run: |
          SLOT_DATE="${{ github.event.inputs.target_date || github.event.client_payload.target_date || 'today' }}"
          if [ -z "$SLOT_DATE" ]; then SLOT_DATE="today"; fi
          python five_b_innovation/main.py "$SLOT_DATE"

      - name: Commit & Push Updated Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add five_b_innovation/data/device_id_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update 5B device cache [skip ci]" && git push)
