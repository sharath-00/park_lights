name: Daily BBMP Park Lights Audit (East Zone)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date YYYY-MM-DD (leave empty for today)'
        required: false
        default: ''
  repository_dispatch:
    types: [audit_trigger_east_zone, report_trigger_east_zone, send_email_east_zone, send_email_all]

permissions:
  contents: write

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Dispatch Email Audit Report
        env:
          TZ: "Asia/Kolkata"
          THINGSBOARD_HOST: ${{ secrets.THINGSBOARD_HOST }}
          THINGSBOARD_USERNAME: ${{ secrets.THINGSBOARD_USERNAME }}
          THINGSBOARD_PASSWORD: ${{ secrets.THINGSBOARD_PASSWORD }}
          LIGHT_UIDS: ${{ secrets.LIGHT_UIDS }}
          LIGHT_UIDS_SHEET_URL: ${{ secrets.LIGHT_UIDS_SHEET_URL }}
          TELEMETRY_RELAY_KEY: ${{ secrets.TELEMETRY_RELAY_KEY }}
          AUDIT_TIMINGS: ${{ secrets.AUDIT_TIMINGS_EAST_ZONE || '19:00,22:00,05:00,07:00' }}
          EXPECTED_DAILY_RUNS: ${{ secrets.EXPECTED_DAILY_RUNS || '4' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS_EAST_ZONE || secrets.RECIPIENT_EMAILS }}
          SAVE_LOCAL_HTML: "False"
          EXCLUDE_ZONES: "bommanahali"
        run: |
          SLOT_DATE="${{ github.event.inputs.target_date || github.event.client_payload.target_date || 'today' }}"
          if [ -z "$SLOT_DATE" ]; then SLOT_DATE="today"; fi
          python send_report.py "$SLOT_DATE"

      - name: Commit & Push Updated Storage
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update storage after email dispatch [skip ci]" && git push)
